name: EAS Android Build

permissions:
  contents: write

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android
      publish_release:
        description: Attach the APK to a GitHub Release
        required: true
        default: true
        type: boolean

concurrency:
  group: eas-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Expo checks
        run: npx expo-doctor

      - name: Build APK
        run: |
          eas build \
            --platform ${{ inputs.platform || 'android' }} \
            --profile ${{ inputs.profile || 'production' }} \
            --non-interactive \
            --wait \
            --json > eas-build-result.json

      - name: Download APK artifact
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const raw = fs.readFileSync('eas-build-result.json', 'utf8');
          const parsed = JSON.parse(raw);
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const apkUrl = build?.artifacts?.buildUrl;

          if (!apkUrl) {
            throw new Error('No APK artifact URL found in EAS build result.');
          }

          fs.writeFileSync('apk-url.txt', apkUrl);
          NODE

          curl -L "$(cat apk-url.txt)" -o matcha-app-android.apk

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matcha-app-android-apk
          path: matcha-app-android.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >-
          github.event_name == 'workflow_run' ||
          inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          SHORT_SHA="${SOURCE_SHA:0:7}"
          TAG="android-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          TITLE="Matcha Android APK ${SHORT_SHA}"

          gh release create "$TAG" matcha-app-android.apk \
            --target "$SOURCE_SHA" \
            --title "$TITLE" \
            --notes "APK Android générée automatiquement par EAS Build depuis le commit ${SOURCE_SHA}."
